name: Deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ijra-prod
  cancel-in-progress: false

jobs:
  changes:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Detect app changes
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          base=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --limit 50 \
            --json headSha --jq "[.[] | select(.headSha != \"$HEAD_SHA\")][0].headSha // \"\"")
          if [ -z "$base" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -C "$GITHUB_WORKSPACE" fetch --quiet origin "$base"
          if git -C "$GITHUB_WORKSPACE" diff --quiet "$base" "$HEAD_SHA" -- src migrations public package.json package-lock.json next.config.ts open-next.config.ts postcss.config.mjs tsconfig.json wrangler.jsonc; then
            echo "app=false" >> "$GITHUB_OUTPUT"
          else
            echo "app=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Write private project config
        run: echo '${{ secrets.PROJECTS_JSON }}' > src/projects.json

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply ijra --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build and deploy to Cloudflare Workers
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
